[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Forms – detect forms in built HTML
[dev]
  command = "npm run dev"
  targetPort = 43127
  port = 8888

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
