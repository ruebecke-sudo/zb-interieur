[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Alte Planungs-Unterseiten
[[redirects]]
  from = "/kuechenplanungen-2"
  to = "/planung#kueche"
  status = 301

[[redirects]]
  from = "/kuechenplanungen-2/"
  to = "/planung#kueche"
  status = 301

[[redirects]]
  from = "/badeinrichtungen"
  to = "/planung#bad"
  status = 301

[[redirects]]
  from = "/badeinrichtungen/"
  to = "/planung#bad"
  status = 301

[[redirects]]
  from = "/bueroeinrichtungen-2"
  to = "/planung#buero"
  status = 301

[[redirects]]
  from = "/bueroeinrichtungen-2/"
  to = "/planung#buero"
  status = 301

[[redirects]]
  from = "/terrassenplanung"
  to = "/planung#terrasse"
  status = 301

[[redirects]]
  from = "/terrassenplanung/"
  to = "/planung#terrasse"
  status = 301

[[redirects]]
  from = "/objekt-hoteleinrichtungen-2"
  to = "/planung#objekt"
  status = 301

[[redirects]]
  from = "/objekt-hoteleinrichtungen-2/"
  to = "/planung#objekt"
  status = 301

[[redirects]]
  from = "/sonderanfertigungen-2"
  to = "/planung#sonder"
  status = 301

[[redirects]]
  from = "/sonderanfertigungen-2/"
  to = "/planung#sonder"
  status = 301

[[redirects]]
  from = "/raumgestaltung"
  to = "/planung#raumgestaltung"
  status = 301

[[redirects]]
  from = "/raumgestaltung/"
  to = "/planung#raumgestaltung"
  status = 301

# Alte Galerie-/Blog-Pfade
[[redirects]]
  from = "/galerien/*"
  to = "/planung"
  status = 301

[[redirects]]
  from = "/galerie/*"
  to = "/planung"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301

# SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Forms – detect forms in built HTML
[dev]
  command = "npm run dev"
  targetPort = 43127
  port = 8888

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
