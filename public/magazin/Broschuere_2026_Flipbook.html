<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZB Interieur · Broschüre 2026</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #580024;
        --accent: #f58220;
        --fog: #f7f5f6;
        --muted: #5b5b5b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Manrope, system-ui, sans-serif;
        background: var(--fog);
        color: #1a1a1a;
        padding: 2rem;
      }
      .card {
        max-width: 34rem;
        text-align: center;
        background: #fff;
        padding: 2.5rem 2rem;
        border: 1px solid #e6e6e6;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
        color: var(--brand);
      }
      p {
        margin: 1rem 0 0;
        line-height: 1.55;
        color: var(--muted);
        font-size: 0.95rem;
      }
      code {
        font-size: 0.85em;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Flipbook folgt</h1>
      <p>
        Bitte den kompletten Ordner mit
        <strong>Broschuere_2026_Flipbook.html</strong>
        und allen Assets hierher legen:
        <br />
        <code>public/magazin/</code>
      </p>
      <p>Danach ersetzt diese Platzhalter-Seite das Blättermagazin automatisch.</p>
    </div>
  </body>
</html>
